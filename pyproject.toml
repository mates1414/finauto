[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finauto"
version = "0.1.0"
description = "FinAuto-Valuation Engine: PDF financials to formula-linked Excel valuation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "XlsxWriter>=3.2",
    "yfinance>=0.2.40",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
]

[project.scripts]
finauto = "finauto.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
